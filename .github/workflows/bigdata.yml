name: Pipeline Laptop Data - EA1, EA2 & EA3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permiso crucial para que el bot pueda guardar los resultados

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Versión estable v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ejecución secuencial de las 3 etapas
      - name: Run EA1 (Ingestion)
        run: python src/ingestion.py

      - name: Run EA2 (Cleaning)
        run: python src/cleaning.py

      - name: Run EA3 (Enrichment)
        run: python src/enrichment.py

      # --- SECCIÓN DE ARTEFACTOS (Para descarga directa en la pestaña Actions) ---
      - name: 📊 Upload Enriched Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data-results
          path: src/xlsx/enriched_data.csv
          retention-days: 30

      - name: 📋 Upload Enrichment Report
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-audit-report
          path: src/static/auditoria/enriched_report.txt

      # --- SECCIÓN DE PERSISTENCIA (Guarda los cambios en tu Repo) ---
      - name: Commit and Push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Agregamos la DB y todos los reportes generados
          git add src/db/ingestion.db src/xlsx/*.csv src/static/auditoria/*.txt
          git commit -m "Auto-update: Pipeline completo EA1-EA2-EA3 ejecutado exitosamente" || echo "No hay cambios para commitear"
          git push
